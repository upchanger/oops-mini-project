<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesFlow — Modern OOP Note Application</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
                <div>
                    <h1 class="brand-title">NotesFlow</h1>
                    <span class="brand-subtitle">Java OOP Enterprise</span>
                </div>
            </div>

            <button id="openCreateModalBtn" class="btn btn-primary btn-block">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Create Note
            </button>

            <nav class="nav-section">
                <span class="nav-heading">Note Categories</span>
                <ul class="nav-list">
                    <li><button class="nav-item active" data-type="ALL"><span class="nav-dot all"></span> All Notes <span class="badge" id="countAll">0</span></button></li>
                    <li><button class="nav-item" data-type="TEXT"><span class="nav-dot text"></span> Text & Markdown <span class="badge" id="countText">0</span></button></li>
                    <li><button class="nav-item" data-type="CHECKLIST"><span class="nav-dot checklist"></span> Checklists <span class="badge" id="countChecklist">0</span></button></li>
                    <li><button class="nav-item" data-type="ENCRYPTED"><span class="nav-dot encrypted"></span> Encrypted Vault <span class="badge" id="countEncrypted">0</span></button></li>
                    <li><button class="nav-item" data-type="REMINDER"><span class="nav-dot reminder"></span> Reminders <span class="badge" id="countReminder">0</span></button></li>
                </ul>
            </nav>

            <div class="nav-section">
                <span class="nav-heading">Filter by Tags</span>
                <div class="tag-cloud" id="tagCloud">
                    <span class="muted-hint">No tags created yet.</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="stats-card">
                    <div class="stat-row">
                        <span>Total Notes</span>
                        <strong id="statTotal">0</strong>
                    </div>
                    <div class="stat-row">
                        <span>Overdue Reminders</span>
                        <strong id="statOverdue" class="text-coral">0</strong>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header Bar -->
            <header class="topbar">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search by title, content, or #tag..." autocomplete="off">
                    <button id="clearSearchBtn" class="btn-icon" style="display:none;" title="Clear search">×</button>
                </div>

                <div class="topbar-actions">
                    <div class="sort-selector">
                        <label for="sortSelect">Sort by:</label>
                        <select id="sortSelect" class="form-select">
                            <option value="updated">Recently Updated</option>
                            <option value="created">Recently Created</option>
                            <option value="title">Title (A-Z)</option>
                            <option value="priority">Priority</option>
                        </select>
                    </div>
                </div>
            </header>

            <!-- Active Filter Bar -->
            <div id="filterBanner" class="filter-banner" style="display:none;">
                <span id="filterLabel">Filtering by tag: <strong id="filterValue">#study</strong></span>
                <button id="clearFilterBtn" class="btn-link">Clear filter</button>
            </div>

            <!-- Notes Grid View -->
            <section class="notes-container" id="notesContainer">
                <!-- Dynamically loaded cards -->
            </section>
        </main>
    </div>

    <!-- Create Note Modal -->
    <div id="createModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Create New Note</h2>
                <button class="modal-close-btn" id="closeCreateModalBtn">&times;</button>
            </div>

            <!-- Type Selector Tabs -->
            <div class="type-tabs" id="typeTabs">
                <button class="tab-btn active" data-type="TEXT">Standard Note</button>
                <button class="tab-btn" data-type="CHECKLIST">Checklist</button>
                <button class="tab-btn" data-type="ENCRYPTED">PIN Encrypted</button>
                <button class="tab-btn" data-type="REMINDER">Reminder</button>
            </div>

            <form id="createNoteForm" class="modal-body">
                <div class="form-group">
                    <label for="noteTitle">Note Title *</label>
                    <input type="text" id="noteTitle" required placeholder="e.g. System Architecture Notes" class="form-input">
                </div>

                <!-- Text Note Fields -->
                <div id="textFields" class="type-fields">
                    <div class="form-group">
                        <label for="textContent">Note Content (Markdown supported)</label>
                        <textarea id="textContent" rows="7" placeholder="Write your thoughts or notes here..." class="form-textarea"></textarea>
                    </div>
                </div>

                <!-- Checklist Fields -->
                <div id="checklistFields" class="type-fields" style="display:none;">
                    <label>Checklist Tasks</label>
                    <div id="checklistItemsContainer" class="items-builder">
                        <div class="item-builder-row">
                            <input type="text" class="form-input checklist-input" placeholder="e.g. Implement NoteFactory pattern">
                        </div>
                    </div>
                    <button type="button" id="addChecklistRowBtn" class="btn btn-secondary btn-sm">+ Add Task</button>
                </div>

                <!-- Encrypted Fields -->
                <div id="encryptedFields" class="type-fields" style="display:none;">
                    <div class="form-group">
                        <label for="encryptedContent">Secret Content *</label>
                        <textarea id="encryptedContent" rows="5" placeholder="Enter private thoughts, credentials, or sensitive data..." class="form-textarea"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="encryptedPin">Security PIN (4+ digits) *</label>
                        <input type="password" id="encryptedPin" maxlength="12" placeholder="e.g. 1234" class="form-input">
                        <span class="field-hint">Your PIN is hashed using SHA-256 and never stored in plain text.</span>
                    </div>
                </div>

                <!-- Reminder Fields -->
                <div id="reminderFields" class="type-fields" style="display:none;">
                    <div class="form-group">
                        <label for="reminderContent">Reminder Details</label>
                        <textarea id="reminderContent" rows="4" placeholder="Brief note about the reminder..." class="form-textarea"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-half">
                            <label for="reminderDueDate">Due Date & Time *</label>
                            <input type="datetime-local" id="reminderDueDate" class="form-input">
                        </div>
                        <div class="form-group col-half">
                            <label for="reminderPriority">Priority Level *</label>
                            <select id="reminderPriority" class="form-select">
                                <option value="LOW">Low Priority</option>
                                <option value="MEDIUM" selected>Medium Priority</option>
                                <option value="HIGH">High Priority</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="noteTags">Tags (comma-separated)</label>
                    <input type="text" id="noteTags" placeholder="e.g. java, design-patterns, backend" class="form-input">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelCreateBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveNoteBtn">Save Note</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Unlock PIN Modal -->
    <div id="unlockModal" class="modal-overlay" style="display:none;">
        <div class="modal-card modal-sm">
            <div class="modal-header">
                <h2>Unlock Protected Note</h2>
                <button class="modal-close-btn" id="closeUnlockModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p id="unlockNoteTitle" class="unlock-title-label"></p>
                <div class="form-group">
                    <label for="unlockPinInput">Enter 4-Digit Security PIN</label>
                    <input type="password" id="unlockPinInput" class="form-input pin-input" maxlength="12" placeholder="••••" autofocus>
                </div>
                <div id="unlockError" class="error-banner" style="display:none;"></div>
                <div id="unlockedContentBox" class="unlocked-content-box" style="display:none;">
                    <span class="content-box-heading">Decrypted Content:</span>
                    <pre id="unlockedContentText"></pre>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelUnlockBtn">Close</button>
                <button type="button" class="btn btn-primary" id="submitUnlockBtn">Unlock Note</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification"></div>

    <script src="app.js"></script>
</body>
</html>
